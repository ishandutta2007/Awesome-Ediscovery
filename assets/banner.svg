<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <style>
      .bg-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .float-1 {
        animation: float 8s ease-in-out infinite alternate;
      }
      .float-2 {
        animation: float 10s ease-in-out infinite alternate-reverse;
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.98); transform-origin: center; }
        100% { opacity: 0.55; transform: scale(1.02); transform-origin: center; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="180" fill="#4f46e5" opacity="0.3" class="bg-pulse"/>
  <circle cx="1050" cy="240" r="200" fill="#9333ea" opacity="0.25" class="bg-pulse"/>

  <!-- Subtle Dynamic Floating Background Elements -->
  <g opacity="0.2" class="float-1">
    <path d="M 900 60 L 980 120 L 920 200 Z" stroke="#818cf8" stroke-width="2" fill="none"/>
    <circle cx="900" cy="60" r="6" fill="#818cf8"/>
    <circle cx="980" cy="120" r="6" fill="#c084fc"/>
    <circle cx="920" cy="200" r="6" fill="#f472b6"/>
  </g>
  <g opacity="0.15" class="float-2">
    <rect x="120" y="160" width="100" height="100" rx="12" stroke="#a855f7" stroke-width="2" fill="none"/>
    <line x1="120" y1="210" x2="220" y2="210" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Glowing Accent Header & Footer Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)"/>
  <rect x="0" y="314" width="1200" height="6" fill="url(#accent-grad)"/>

  <!-- Foreground Content -->
  <g transform="translate(60, 0)">
    <!-- Category Badge Pill -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="url(#accent-grad)" opacity="0.95"/>
      <text x="115" y="21" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME LEGALTECH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" fill="url(#text-grad)" font-size="48" font-weight="800" letter-spacing="-0.5">Awesome E-Discovery</text>

    <!-- Subtitle -->
    <text x="0" y="186" fill="#94a3b8" font-size="20" font-weight="400">Curated SaaS Platforms, Forensic Data Tools &amp; Open-Source Review Workflows</text>

    <!-- Feature Badges -->
    <g transform="translate(0, 224)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="24" fill="#38bdf8" font-size="14" font-weight="600">Legal Document Review</text>

      <!-- Badge 2 -->
      <rect x="236" y="0" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="256" y="24" fill="#c084fc" font-size="14" font-weight="600">Digital Forensics &amp; ESI</text>

      <!-- Badge 3 -->
      <rect x="472" y="0" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="492" y="24" fill="#4ade80" font-size="14" font-weight="600">Open-Source Pipelines</text>
    </g>
  </g>
</svg>
